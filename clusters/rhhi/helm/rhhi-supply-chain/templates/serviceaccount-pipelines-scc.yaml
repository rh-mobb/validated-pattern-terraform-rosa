{{- if and .Values.operators.pipelines.enabled .Values.supplyChain.enabled }}
# Buildah steps in Tekton require the pipelines SCC (SETFCAP capability).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tekton.serviceAccount }}-pipelines-scc
  namespace: {{ .Values.tekton.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:pipelines-scc
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tekton.serviceAccount }}
    namespace: {{ .Values.tekton.namespace }}
{{- end }}
