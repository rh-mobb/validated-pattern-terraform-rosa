{{- if .Values.operators.pipelines.enabled }}
# Uses the cluster's existing global-operators OperatorGroup in openshift-operators.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
spec:
  channel: {{ .Values.operators.pipelines.channel }}
  name: openshift-pipelines-operator-rh
  source: {{ .Values.operators.pipelines.source }}
  sourceNamespace: {{ .Values.operators.pipelines.sourceNamespace }}
  installPlanApproval: Automatic
{{- end }}
