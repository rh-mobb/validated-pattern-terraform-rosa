apiVersion: v1
kind: Namespace
metadata:
  name: virt-e2e-test
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: efs-testvm-root
  namespace: virt-e2e-test
spec:
  source:
    pvc:
      name: fedora-1217dcc8c58d
      namespace: openshift-virtualization-os-images
  storage:
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 30Gi
    storageClassName: efs-sc
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: efs-testvm
  namespace: virt-e2e-test
  labels:
    app: efs-live-migrate-test
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: efs-live-migrate-test
    spec:
      # KVM is only on bgp_router metal pools in clusters/virt (see terraform.tfvars).
      nodeSelector:
        bgp_router: "true"
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - port: 22
                  protocol: TCP
        machine:
          type: pc-q35-rhel9.6.0
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: efs-testvm-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: efs-testvm
