# Purpose: Define the Kubernetes ServiceAccount identity and bind it to the shared workload role.
# What this is not: This manifest does not create a long-lived Secret-backed token.
# Prerequisites: A pipeline namespace and a TokenRequest/oc create token rotation process.
#
# This file works on BOTH cluster architectures, because TokenRequest is core
# Kubernetes and is unaffected by how humans authenticate. On a built-in-OAuth
# cluster it is the recommended pipeline identity, because that architecture has
# no client-credentials path for a machine.
# Authoritative references:
# - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
# - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#tokenrequest-api
# Covers: apiVersion, kind, metadata, name, namespace, roleRef, apiGroup, subjects
# Does: Creates one dedicated ServiceAccount and binds it to the shared namespaced workload role.
# Why: Dedicated identity keeps rotation, audit and removal independent from application ServiceAccounts.
# Change: A namespace mismatch changes the ServiceAccount subject and prevents the binding from matching.
# Trap: This manifest creates no token; jobs must use TokenRequest and their own expiry handling.
# Evidence: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
apiVersion: v1
kind: ServiceAccount
metadata:
  # Use a dedicated account so rotation, audit, and deletion do not affect workloads.
  name: <pipeline-service-account>
  namespace: <pipeline-namespace>
---
# Bind the ServiceAccount to the same Role used by the external User. This
# isolates the authentication comparison from authorization differences.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: <pipeline-service-account-binding>
  namespace: <pipeline-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: <pipeline-workload-role>
subjects:
  # The namespace is part of the ServiceAccount identity and must match both
  # the object and RoleBinding namespace.
  - kind: ServiceAccount
    name: <pipeline-service-account>
    namespace: <pipeline-namespace>
